name: GameCube host tests
# This fork only ships on GameCube. The engine builds on the developer's
# machine with devkitPPC; CI runs the host-side tests that check the disc
# tooling and the engine code paths that can be exercised off the console.
on:
  push:
    branches: [master]
  pull_request:
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install test dependencies
      run: python3 -m pip install numpy pillow pyyaml pyfatfs
    - name: Run host tests
      run: python3 -m unittest discover -s tests -v
